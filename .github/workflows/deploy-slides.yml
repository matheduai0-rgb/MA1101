name: Deploy Interactive Calculus Slides to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - '2026/slides/**'
      - 'components/**'
      - 'styles/**'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/**'
      - '.github/workflows/deploy-slides.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (Slidev, JSXGraph)
        run: npm ci --omit=dev

      - name: Prepare Artifact Directory
        run: |
          mkdir -p _site/2026/slides
          cp index.html _site/

          # Copy slide directories containing HTML slides and their media/assets
          if [ -d "2026/slides/23_luas_daerah_pada_bidang" ]; then
            mkdir -p _site/2026/slides/23_luas_daerah_pada_bidang
            cp -r 2026/slides/23_luas_daerah_pada_bidang/* _site/2026/slides/23_luas_daerah_pada_bidang/
          fi

          if [ -d "2026/slides/25_volume_metode_kulit_tabung" ]; then
            mkdir -p _site/2026/slides/25_volume_metode_kulit_tabung
            cp -r 2026/slides/25_volume_metode_kulit_tabung/* _site/2026/slides/25_volume_metode_kulit_tabung/
          fi

          # Copy docs if available
          if [ -d "docs" ]; then
            mkdir -p _site/docs
            cp -r docs/* _site/docs/
          fi

      - name: Build Slidev decks (Socratic Subtopik 5.3, 5.5 and 6.1-6.5)
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}"
          for deck in 32_volume_metode_kulit_tabung 33_kerja 34_fungsi_logaritma_natural \
                      35_fungsi_invers_dan_turunannya 36_fungsi_eksponen_natural \
                      38_fungsi_eksponen_dan_logaritma_umum 37_pertumbuhan_dan_peluruhan_eksponensial; do
            npx slidev build "2026/slides/${deck}/slides.md" \
              --base "${BASE}/2026/slides/${deck}/" \
              --out "$GITHUB_WORKSPACE/_site/2026/slides/${deck}"
          done

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

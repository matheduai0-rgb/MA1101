<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MA1101 · Halaman tidak ditemukan</title>
  <script>
    // GitHub Pages has no SPA fallback, so a link to one slide (…/2026/slides/<deck>/<n>)
    // lands here. The decks are built with hash routing; send the visitor to …/<deck>/#/<n>.
    (function () {
      var m = location.pathname.match(/^(.*\/2026\/slides\/[^\/]+\/)([^\/].*?)\/?$/);
      if (m && !/\.[a-z0-9]+$/i.test(m[2])) {
        location.replace(m[1] + '#/' + m[2] + location.search);
      }
    })();
  </script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1018; color: #e2e8f0;
           font-family: system-ui, sans-serif; padding: 0 16px; text-align: center; }
    a { color: #f5be3c; }
  </style>
</head>
<body>
  <main>
    <h1>Halaman tidak ditemukan</h1>
    <p>Kembali ke <a href="/MA1101/">daftar slide MA1101</a>.</p>
  </main>
</body>
</html>
